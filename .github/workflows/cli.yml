name: CI and Publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish to PyPI"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Version tag to build/publish from when publishing, for example v0.5.1"
        required: false
        type: string

env:
  CHECKOUT_REF: ${{ inputs.publish_to_pypi && inputs.release_tag || github.ref }}

jobs:
  test:
    name: Test and build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install .

      - name: Run tests
        run: |
          pytest -q

      - name: Build package
        run: |
          python -m build

  build:
    name: Build release distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ inputs.publish_to_pypi && startsWith(inputs.release_tag, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ems-file-format-converter
    steps:
      - name: Validate release tag input
        shell: bash
        run: |
          if [[ ! "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must match v*.*.* when publish_to_pypi is true."
            exit 1
          fi

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

