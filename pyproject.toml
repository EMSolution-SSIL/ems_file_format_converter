[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-file-format-converter"
version = "0.2.0"
description = "CAE file format converter (Femap neutral, I-DEAS UNV, ATLAS, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["meshio>=5.0"]

[project.scripts]
ems-file-format-converter = "ems_file_format_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ems_file_format_converter*"]
